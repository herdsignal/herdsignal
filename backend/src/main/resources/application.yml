debug: ${SPRING_DEBUG:false}

spring:
  datasource:
    # 반드시 환경변수로 주입 — 기본값 없음 (없으면 기동 실패)
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:herdsignal}?characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USER:herdsignal}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      # Python(init_db.py)이 생성한 테이블 구조를 그대로 사용 — 스키마 변경 금지
      ddl-auto: validate
    # View 렌더링 중 DB 쿼리 방지 (명시적 비활성화로 WARN 제거)
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        # Spring Boot 3.x에서 MariaDB는 dialect 자동 감지 — 명시 불필요
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  session:
    timeout: ${SESSION_IDLE_TIMEOUT:30d}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 0 * * * *"

  # DevTools: 클래스 변경 시 자동 재시작 (개발 환경 전용)
  devtools:
    restart:
      enabled: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope: openid,profile,email

server:
  port: 8080

logging:
  level:
    com.herdsignal: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    probes:
      add-additional-paths: true

herdsignal:
  evidence:
    # OOS에서 행동 가설은 탈락했으며, 접수시각이 확인된 원시 기업 사실만 읽는다.
    business-state-path: ${HERD_BUSINESS_STATE_PATH:../data/reports/business_state_features_v2.csv}
    # 원문 검수 atomic fact만 읽으며 상향·하향이나 행동 방향을 만들지 않는다.
    guidance-bindings-path: ${HERD_GUIDANCE_BINDINGS_PATH:../data/reports/sec_guidance_atomic_bindings_v2.csv}
  python:
    executable: ${HERD_PYTHON_EXECUTABLE:}
  validation-report-path: ${MODEL_VALIDATION_REPORT_PATH:../data/reports/validation_v2/validation_v2.json}
  vnext:
    # 최신 개인 MVP 판정을 읽기만 하며, 행동 채택 전에는 HOLD·0%로 fail-closed 한다.
    promotion-report-path: ${HERD_VNEXT_PROMOTION_REPORT_PATH:../data/reports/personal_action_review_gate_v2.json}
  promotion:
    approval-path: ${HERD_PROMOTION_APPROVAL_PATH:}
  shadow:
    enabled: ${HERD_SHADOW_ENABLED:false}
    candidate-id: ${HERD_SHADOW_CANDIDATE_ID:}
  ai:
    evidence-review:
      # 연구용 근거 요약만 허용한다. 기본값은 비활성화이며 행동 권한은 항상 HOLD·0%다.
      enabled: ${HERD_AI_EVIDENCE_REVIEW_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_EVIDENCE_MODEL:gpt-5.6-terra}
      timeout: ${OPENAI_EVIDENCE_TIMEOUT:30s}
  auth:
    enabled: ${AUTH_ENABLED:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
    owner-email: ${HERDSIGNAL_OWNER_EMAIL:}
    session-cookie-max-age: ${SESSION_COOKIE_MAX_AGE:180d}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
